    <style>
      /* Critical CSS for faster initial load */
      body {
        margin: 0;
        padding: 0;
        background: #010409;
        font-family: 'JetBrains Mono', 'Consolas', monospace;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading spinner */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #010409;
        z-index: 10000;
      }

      .loading-text {
        color: #7ee787;
        font-size: 18px;
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <span class="loading-text">Initializing terminal...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
