<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/terminal.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yasin Kamis - Frontend Developer Portfolio | Terminal Style" />
    <meta name="keywords" content="frontend developer, react, javascript, typescript, portfolio" />
    <meta name="author" content="Yasin Kamis" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yasin Kamis | Frontend Developer" />
    <meta property="og:description" content="Interactive terminal-style portfolio showcasing my work and skills." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yasin Kamis | Frontend Developer" />
    <meta name="twitter:description" content="Interactive terminal-style portfolio showcasing my work and skills." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0d1117" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Yasin Kamis | Frontend Developer</title>

    <style>
      /* Critical CSS for faster initial load */
      body {
        margin: 0;
        padding: 0;
        background: #010409;
        font-family: 'JetBrains Mono', 'Consolas', monospace;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading spinner */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #010409;
        z-index: 10000;
      }

      .loading-text {
        color: #7ee787;
        font-size: 18px;
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <span class="loading-text">Initializing terminal...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
